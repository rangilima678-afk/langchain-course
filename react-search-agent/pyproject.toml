[project]
name = "react-search-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "jayashreema", email = "rangili.ma678@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "black>=26.5.1",
    "isort>=9.0.1",
    "langchain>=1.3.18",
    "langchain-community>=0.4.2",
    "langchain-openai>=1.6.0",
    "python-dotenv>=1.2.3",
    "tavily-python>=0.8.3",
]

[project.scripts]
